name: Publish private source Space

# The committed writer for the private static Space SZLHOLDINGS/szl-safe-stack.
# It only wraps tools/publish_hf_source.py, which keeps every guard it has when
# run locally: signed and protected main, green source-contract on the exact
# head, pinned publication SDK, optimistic parent commit, full readback, and no
# automatic retry. The caller supplies the Space commit it observed; if the
# Space moved, the publisher refuses.
#
# Dispatch-only: it never runs on push or pull requests, so merging it writes
# nothing to the Hub.
#
# Secrets:
#   HF_TOKEN                      write access to spaces/SZLHOLDINGS/szl-safe-stack
#   BRANCH_PROTECTION_READ_TOKEN  read-only GitHub token with Administration: read on
#                                 this repository; the publisher verifies branch
#                                 protection, which GITHUB_TOKEN cannot read.

on:
  workflow_dispatch:
    inputs:
      expected_parent:
        description: "Exact current commit (40 hex) of the Space SZLHOLDINGS/szl-safe-stack"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish verified source distribution
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # One lock per Hub asset (HF plan D3); a queued publication is never cancelled.
    concurrency:
      group: hf-write/space/SZLHOLDINGS/szl-safe-stack
      cancel-in-progress: false
    env:
      EXPECTED_PARENT: ${{ inputs.expected_parent }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Require the exact observed Space commit
        run: |
          if ! [[ "$EXPECTED_PARENT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_parent must be the exact 40-hex Space commit"
            exit 1
          fi

      - name: Require the publication credentials
        run: |
          missing=0
          if [ -z "$HF_TOKEN" ]; then echo "::error::repository secret HF_TOKEN is not configured"; missing=1; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::repository secret BRANCH_PROTECTION_READ_TOKEN is not configured"; missing=1; fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install the pinned publication SDK
        run: |
          python -m venv "$RUNNER_TEMP/publish-venv"
          "$RUNNER_TEMP/publish-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-publish.lock
          "$RUNNER_TEMP/publish-venv/bin/python" -m pip check

      - name: Publish, then read back every release file
        run: |
          "$RUNNER_TEMP/publish-venv/bin/python" tools/publish_hf_source.py \
            --output "$RUNNER_TEMP/safe-stack-release" \
            --publish \
            --expected-parent "$EXPECTED_PARENT"

      - name: Keep the publication receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safe-stack-space-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/safe-stack-release/publication-receipts.jsonl
            ${{ runner.temp }}/safe-stack-release/source-manifest.json
          if-no-files-found: warn
          retention-days: 90
