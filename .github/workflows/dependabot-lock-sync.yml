name: Dependabot lock sync

# Dependabot bumps pins in safe-qa-service/pyproject.toml and
# safe-qa-service/build-requirements.in but cannot regenerate the hashed uv
# locks that source-contract installs with --require-hashes, so its pip PRs
# fail until the locks are regenerated by hand.
#
# regenerate: read-only token. Runs the trusted base-commit copy of
#   tools/sync_locks.py against the Dependabot head and checks the result.
# commit: write token. Never runs repository or package code. Writes only the
#   allowlisted lock files back to the same Dependabot branch through the API
#   (GitHub-signed, bound to the exact head that was read), then dispatches CI
#   because commits made with GITHUB_TOKEN do not start pull_request runs
#   without approval.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - safe-qa-service/pyproject.toml
      - safe-qa-service/build-requirements.in

permissions: {}

concurrency:
  group: dependabot-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Only Dependabot's own pushes to its own pip branches in this repository.
    # A push by anyone else, including this workflow's commit, skips both jobs.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/pip/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Ignore uv.toml / [tool.uv] discovered from the checkouts.
      UV_NO_CONFIG: "1"
    steps:
      - name: Check out trusted tooling (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out Dependabot head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pinned lock tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r base/.github/lock-tool-requirements.lock
      - name: Tool is a no-op on the base commit
        run: |
          LOCK_SYNC_ROOT="$PWD/base" python base/tools/sync_locks.py
          git -C base diff --exit-code
      - name: Regenerate locks on the Dependabot head
        run: |
          LOCK_SYNC_ROOT="$PWD/pr" python base/tools/sync_locks.py
      - name: Declarations now match the installed locks
        working-directory: pr
        run: python -m unittest tests.test_dependency_lock_alignment -v
      - name: Collect regenerated files
        id: collect
        working-directory: pr
        run: |
          mkdir -p "$RUNNER_TEMP/lock-sync"
          python - <<'PY'
          import base64, json, os, subprocess
          out = subprocess.run(["git", "diff", "--name-only", "-z"],
                               check=True, capture_output=True, text=True).stdout
          paths = [p for p in out.split("\0") if p]
          additions = [{"path": p, "contents": base64.b64encode(open(p, "rb").read()).decode()}
                       for p in paths]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "lock-sync", "additions.json"), "w") as f:
              json.dump(additions, f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if paths else 'false'}\n")
          print("changed:", " ".join(paths) or "none")
          PY
      - name: Upload regenerated files
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-sync
          path: ${{ runner.temp }}/lock-sync/additions.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: regenerate
    # The regenerate guard is repeated here because this is the only job that
    # can write; it must never target a branch Dependabot does not own.
    if: >-
      needs.regenerate.outputs.changed == 'true' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/pip/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # createCommitOnBranch on the Dependabot branch
      actions: write    # workflow_dispatch of ci.yml for the new head
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Download regenerated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lock-sync
          path: ${{ runner.temp }}/lock-sync
      - name: Commit regenerated locks (API commit, GitHub-signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/commit.json"
          import base64, json, os
          if not os.environ["HEAD_REF"].startswith("dependabot/pip/"):
              raise SystemExit(f"refusing to commit to {os.environ['HEAD_REF']!r}")
          allowed = {".github/test-requirements.in", ".github/test-requirements.lock",
                     "safe-qa-service/requirements.lock", "safe-qa-service/build-requirements.lock"}
          with open(os.path.join(os.environ["RUNNER_TEMP"], "lock-sync", "additions.json")) as f:
              additions = json.load(f)
          paths = [a["path"] for a in additions]
          if not paths or len(set(paths)) != len(paths) or not set(paths) <= allowed:
              raise SystemExit(f"refusing to commit unexpected paths: {paths}")
          for a in additions:
              base64.b64decode(a["contents"], validate=True)
          print(json.dumps({
              "query": "mutation($input: CreateCommitOnBranchInput!) {"
                       " createCommitOnBranch(input: $input) { commit { oid } } }",
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                             "branchName": os.environ["HEAD_REF"]},
                  "expectedHeadOid": os.environ["HEAD_SHA"],
                  # [dependabot skip] lets Dependabot keep rebasing its branch.
                  "message": {"headline": "chore(deps): regenerate hashed locks [dependabot skip]",
                              "body": f"Generated by tools/sync_locks.py from the base commit for #{os.environ['PR_NUMBER']}."},
                  "fileChanges": {"additions": [{"path": a["path"], "contents": a["contents"]}
                                                for a in additions]}}}}))
          PY
          oid=$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)
          test -n "$oid"
          echo "Committed $oid to $HEAD_REF"
      - name: Dispatch CI for the new head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
