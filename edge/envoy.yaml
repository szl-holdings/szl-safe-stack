# Edge proxy for the opt-in compose profile "edge" (szl-safe-stack).
# This file is mounted read-only at /etc/envoy/envoy.yaml in edge-envoy.
# It fronts the two local APIs on separate host loopback ports and exports
# OTLP traces to edge-otel (opentelemetry-collector-contrib 0.118.0).
#
# Scope and honesty:
# - CI does not start the "edge" profile; this config is validated only when
#   an operator starts the profile locally (envoy --mode validate can check it).
# - The upstream envoy.tracers.opentelemetry extension is documented by Envoy
#   as work-in-progress and not for production use; the edge profile is a
#   local observability aid, not a deployment boundary.
static_resources:
  listeners:
    - name: gateway_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8790 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge_gateway
                use_remote_address: true
                tracing: {}
                route_config:
                  name: gateway_routes
                  virtual_hosts:
                    - name: gateway
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: gateway
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: safeqa_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8090 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge_safeqa
                use_remote_address: true
                tracing: {}
                route_config:
                  name: safeqa_routes
                  virtual_hosts:
                    - name: safeqa
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: safeqa
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: gateway
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: gateway, port_value: 8787 }
    - name: safeqa
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: safeqa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: safeqa, port_value: 8080 }
    - name: otel_collector
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: edge-otel, port_value: 4317 }

tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc:
          cluster_name: otel_collector
      service_name: szl-safe-stack-edge

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
