[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-qa-service"
version = "0.2.1"
description = "Fail-closed evidence intake and audit service; never a clinical or biological decision system."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3==1.43.100",
  "fastapi==0.141.1",
  "kubernetes==36.0.3",
  "oauthlib==4.0.0",
  "pydantic==2.13.5",
  "psycopg[binary]==3.3.6",
  "PyJWT[crypto]==2.14.0",
  "starlette==1.6.0",
  "uvicorn[standard]==0.53.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
safe-qa-approval = "safe_qa_service.approval_cli:main"

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["quarantine"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
